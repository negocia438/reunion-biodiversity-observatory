name: CI Python et dbt

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-tests:
    name: Vérification Python et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements-ci.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app tests

      - name: Analyser la qualité du code avec Ruff
        run: python -m ruff check app tests

      - name: Exécuter les tests Python
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dbt-tests:
    name: PostgreSQL et modèles dbt
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: reunion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d reunion_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_DB_PASSWORD: ci_only_password

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dbt et le pilote PostgreSQL
        run: |
          python -m pip install dbt-core==1.12.6 dbt-postgres==1.11.0 psycopg2-binary

      - name: Vérifier les fichiers nécessaires
        run: |
          test -f ci/profiles.yml
          test -f ci/fixtures.sql
          test -f reunion_dbt/tests/assert_annual_mart.sql
          test -f reunion_dbt/tests/assert_ci_fixture.sql

      - name: Charger les données de test
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg2

          with psycopg2.connect(
              host="localhost",
              port=5432,
              dbname="reunion_ci",
              user="ci_user",
              password=os.environ["CI_DB_PASSWORD"],
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute(Path("ci/fixtures.sql").read_text())
          PY

      - name: Installer les packages dbt
        working-directory: reunion_dbt
        run: dbt deps

      - name: Construire les modèles et exécuter les tests
        working-directory: reunion_dbt
        run: dbt build --profiles-dir ../ci --target ci
